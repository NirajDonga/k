apiVersion: v1
kind: Pod
metadata:
  name: mongo-pod
spec:
  containers:
  - name: mongo
    image: mongo:4.4
    ports:
    - containerPort: 27017
    volumeMounts: 
    - mountPath: "/data/db"
      name: nfs-volume
  volumes:
  - name: nfs-volume
    PersistentVolumeClaim:
      claimName: nfs-pvc